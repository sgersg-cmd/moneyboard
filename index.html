<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#24314d" />
  <meta name="description" content="카드생활비·할부 관리 대시보드" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="머니보드" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="custom.css" />
  <title>머니보드</title>
</head>
<body>
  <div id="loadingScreen" class="splash-screen">
    <div class="brand-mark">₩</div>
    <h1>머니보드</h1>
    <p>이번 달 돈의 흐름을 정리하는 중이에요.</p>
  </div>

  <main id="loginScreen" class="auth-screen hidden" aria-labelledby="loginTitle">
    <section class="auth-card">
      <div class="brand-mark small">₩</div>
      <p class="eyebrow">MONEY BOARD</p>
      <h1 id="loginTitle">머니보드</h1>
      <form id="loginForm" class="stack-lg">
        <label>
          <span>이메일</span>
          <input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com" />
        </label>
        <label>
          <span>비밀번호</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="비밀번호" />
        </label>
        <button type="submit" class="primary-btn full">로그인</button>
      </form>
      <p id="loginMessage" class="form-message" aria-live="polite"></p>
    </section>
  </main>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <div>
        <h1 id="appTitle">머니보드</h1>
      </div>
      <button id="syncBadge" class="sync-badge" type="button" title="동기화 상태">
        <span class="sync-dot"></span>
        <span id="syncText">저장됨</span>
      </button>
    </header>

    <section id="pageContainer" class="page-container" aria-live="polite"></section>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button type="button" data-page="home" class="nav-item active"><span>⌂</span><b>홈</b></button>
      <button type="button" data-page="expenses" class="nav-item"><span>₩</span><b>지출</b></button>
      <button type="button" data-page="commitments" class="nav-item"><span>▦</span><b>고정비</b></button>
      <button type="button" data-page="plans" class="nav-item"><span>◇</span><b>계획</b></button>
      <button type="button" data-page="settings" class="nav-item"><span>⚙</span><b>설정</b></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <script src="custom.js"></script>
</body>
</html>
